theme: jekyll-theme-so-simple

title: "Gérard Rozsavolgyi"
tagline: "Cours en ligne, ouvrages et lectures mathématiques"
description: "Cours en ligne (PHP, Unix, JavaScript, Docker, Django, Flutter, Git, cybersécurité), ouvrages de mathématiques chez Dunod et lectures mathématiques, par Gérard Rozsavolgyi."
baseurl: ""
url: "https://roza.github.io"
lang: fr-FR
timezone: Europe/Paris

# Vérification Search Console (lue par le thème so-simple)
owner:
  google:
    verify: "K-UkhhvOd-npaqQK7Vry2tcFXlDCu-3GAYcBmtnBq58"

# jekyll-seo-tag : identité (JSON-LD) et liens
social:
  name: "Gérard Rozsavolgyi"
  links:
    - https://github.com/roza

author:
  name: "Gérard Rozsavolgyi"
  links:
    - title: GitHub
      url: https://github.com/roza
      icon: fab fa-github

read_time: true
words_per_minute: 200
toc: true

comments: false

# Navigation
navigation_pages:
  - about.md
  - categories.md
  - publications.md

paginate: 10
paginate_path: /page:num/

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true

plugins:
  - jekyll-archives
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - Gemfile.ori
