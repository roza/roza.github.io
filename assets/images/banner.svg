<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <text x="60" y="160" font-family="monospace" font-size="90" fill="rgba(99,102,241,0.3)">&lt;/&gt;</text>
  <text x="970" y="145" font-family="monospace" font-size="65" fill="rgba(167,139,250,0.22)">{ }</text>
  <text x="220" y="70" font-family="monospace" font-size="17" fill="rgba(255,255,255,0.07)">def cours():</text>
  <text x="880" y="200" font-family="monospace" font-size="15" fill="rgba(255,255,255,0.07)">git commit -m "learn"</text>
  <text x="160" y="215" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.05)">import knowledge</text>
  <text x="900" y="65" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.05)">docker run --rm</text>
  <text x="60" y="228" font-family="monospace" font-size="15" fill="rgba(52,211,153,0.45)">$ _</text>
  <text x="600" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="52" font-weight="700" fill="white">Cours en ligne</text>
  <text x="600" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="20" fill="rgba(199,210,254,0.85)">Web · DevOps · Mobile · Backend</text>
  <rect x="510" y="192" width="180" height="2" rx="1" fill="url(#accent)"/>
</svg>
