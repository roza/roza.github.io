---
layout: page
---

<h1>Tag : {{ page.title }}</h1>

<ul class="archive-list">
  {% for post in page.posts %}
  <li>
    <span class="archive-date">{{ post.date | date: "%d/%m/%Y" }}</span>
    <a href="{{ post.url }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>

<style>
.archive-list { list-style: none; padding: 0; }
.archive-list li { padding: 0.5rem 0; border-bottom: 1px solid #e5e7eb; display: flex; gap: 1rem; align-items: baseline; }
.archive-date { font-size: 0.85rem; color: #9ca3af; white-space: nowrap; }
</style>
