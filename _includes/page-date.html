{% comment %} Surcharge locale (so-simple 3.2.0) : entry.url est vide sur une page d'article ; repli sur page.url. {% endcomment %}
<time class="page-date dt-published" datetime="{{ page.date | date_to_xmlschema }}">
  {%- assign date_format = site.date_format | default: "%B %-d, %Y" -%}
  <a class="u-url" href="{{ entry.url | default: page.url | relative_url }}">{{ page.date | date: date_format }}</a>
</time>
